plugins {
    id 'java-library'
}

apply from: file('../gradle/matrix-defaults.gradle')
apply from: file('../gradle/java-conventions.gradle')
def matrixTarget = resolveMatrixTarget('turtlelib_minecraft_version')
def resolvedJavaLanguageVersion = applyJavaConventions(matrixTarget).toString()

def versionProperties = new Properties()
def versionFile = file('../version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProperties.load(it) }
}
def versionFromFile = versionProperties.getProperty('version')

// Explicit -P values (passed per target by the matrix release builds) win over the matrix defaults.
def resolvedTurtleLibName = providers.gradleProperty('turtlelib_name').getOrElse('TurtleLib')
def resolvedMinecraftVersion = matrixTarget.minecraft
def resolvedNeoForgeVersion = providers.gradleProperty('turtlelib_neoforge_version').getOrElse(matrixTarget.neoforge)

def libNameForFile = (resolvedTurtleLibName as String).replaceAll(/[^A-Za-z0-9]/, '')
def mcVersionForFile = (resolvedMinecraftVersion as String).replace('.', '-')
def neoForgeVersionForFile = (resolvedNeoForgeVersion as String).replace('.', '-').replace('+', '-').replace('_', '-')
def modLicenseFile = file('../LICENSE')
def turtleLibDistDir = layout.projectDirectory.dir('../dist')
def turtleLibDistSourcesDir = layout.projectDirectory.dir('../dist/sources')

// Shared, loader-neutral library code lives in :turtlelib-core. This module only
// carries NeoForge metadata and packaging, and bundles the compiled core classes/sources.
def turtleLibCore = project(':turtlelib-core')

group = providers.gradleProperty('turtlelib_group').getOrElse('com.github.hrobasti.turtlelib')
version = providers.gradleProperty('turtlelib_version').orElse(versionFromFile ?: '0.1').get()

repositories {
    mavenCentral()
}

dependencies {
    api project(':turtlelib-core')
}

tasks.named('processResources', ProcessResources) {
    inputs.property('turtlelib_name', resolvedTurtleLibName)
    inputs.property('minecraft_version', resolvedMinecraftVersion)
    inputs.property('neoforge_version', resolvedNeoForgeVersion)
    inputs.property('java_language_version', resolvedJavaLanguageVersion)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            file                  : [jarVersion: project.version],
            turtlelib_name         : resolvedTurtleLibName,
            minecraft_version      : resolvedMinecraftVersion,
            neoforge_version       : resolvedNeoForgeVersion,
            java_language_version  : resolvedJavaLanguageVersion
        ])
    }
}

tasks.named('processResources', ProcessResources) {
    from('../fabric/src/main/resources') {
        include 'assets/turtlelib/icon.png'
    }

    from('../fabric/src/main/resources/assets/turtlelib/icon.png') {
        rename { 'icon.png' }
    }
}

// jar / sourcesJar write directly into dist via destinationDirectory; no copy-into-dist
// task is needed (and would trip Gradle's overlapping-output validation).
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(turtleLibCore.sourceSets.main.output)
    from(modLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }

    destinationDirectory = turtleLibDistDir
    archiveFileName = "${libNameForFile}_${project.version}_MC-${mcVersionForFile}_NEOFORGE_${neoForgeVersionForFile}.jar"
    manifest {
        attributes(
            'Implementation-Title': resolvedTurtleLibName,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'hrobasti'
        )
    }
}

tasks.named('sourcesJar') {
    from(turtleLibCore.sourceSets.main.allSource)
    from(modLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }

    destinationDirectory = turtleLibDistSourcesDir
    archiveFileName = "${libNameForFile}_${project.version}_MC-${mcVersionForFile}_NEOFORGE_${neoForgeVersionForFile}-source.jar"
}
