plugins {
    id 'java-library'
}

def versionProperties = new Properties()
def versionFile = file('../version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProperties.load(it) }
}
def versionFromFile = versionProperties.getProperty('version')

def sharedWorkspaceProperties = new Properties()
def sharedWorkspaceGradlePropertiesFile = file('../../../gradle.properties')
if (sharedWorkspaceGradlePropertiesFile.exists()) {
    sharedWorkspaceGradlePropertiesFile.withInputStream { sharedWorkspaceProperties.load(it) }
}

def requireConfigValue = { String key, String value ->
    if (value == null || value.isBlank()) {
        throw new GradleException("Missing required TurtleLib NeoForge config value '${key}'. Provide it via Gradle property or root gradle.properties.")
    }
    value
}

def resolvedTurtleLibName = providers.gradleProperty('turtlelib_name').getOrElse(sharedWorkspaceProperties.getProperty('turtlelib_name', 'TurtleLib'))
def resolvedMinecraftVersionRaw = providers.gradleProperty('turtlelib_minecraft_version')
    .orElse(providers.gradleProperty('minecraft_version'))
    .getOrElse(sharedWorkspaceProperties.getProperty('turtlelib_minecraft_version', sharedWorkspaceProperties.getProperty('minecraft_version')))
def resolvedMinecraftVersion = requireConfigValue('turtlelib_minecraft_version|minecraft_version', resolvedMinecraftVersionRaw)

def resolvedNeoForgeVersionRaw = providers.gradleProperty('turtlelib_neoforge_version')
    .orElse(providers.gradleProperty('neoforge_version'))
    .getOrElse(sharedWorkspaceProperties.getProperty('turtlelib_neoforge_version', sharedWorkspaceProperties.getProperty('neoforge_version')))
def resolvedNeoForgeVersion = requireConfigValue('turtlelib_neoforge_version|neoforge_version', resolvedNeoForgeVersionRaw)

def resolvedJavaLanguageVersion = providers.gradleProperty('java_language_version').orElse('21').get()

def libNameForFile = (resolvedTurtleLibName as String).replaceAll(/[^A-Za-z0-9]/, '')
def mcVersionForFile = (resolvedMinecraftVersion as String).replace('.', '-')
def neoForgeVersionForFile = (resolvedNeoForgeVersion as String).replace('.', '-').replace('+', '-').replace('_', '-')
def modLicenseFile = file('../LICENSE')
def turtleLibDistDir = layout.projectDirectory.dir('../dist')
def turtleLibDistSourcesDir = layout.projectDirectory.dir('../dist/sources')

// Shared, loader-neutral library code lives in :turtlelib-core. This module only
// carries NeoForge metadata and packaging, and bundles the compiled core classes/sources.
def turtleLibCore = project(':turtlelib-core')

group = providers.gradleProperty('turtlelib_group').getOrElse('com.github.hrobasti.turtlelib')
version = providers.gradleProperty('turtlelib_version').orElse(versionFromFile ?: '0.1').get()

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':turtlelib-core')
}

tasks.named('processResources', ProcessResources) {
    inputs.property('turtlelib_name', resolvedTurtleLibName)
    inputs.property('minecraft_version', resolvedMinecraftVersion)
    inputs.property('neoforge_version', resolvedNeoForgeVersion)
    inputs.property('java_language_version', resolvedJavaLanguageVersion)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            file                  : [jarVersion: project.version],
            turtlelib_name         : resolvedTurtleLibName,
            minecraft_version      : resolvedMinecraftVersion,
            neoforge_version       : resolvedNeoForgeVersion,
            java_language_version  : resolvedJavaLanguageVersion
        ])
    }
}

tasks.named('processResources', ProcessResources) {
    from('../fabric/src/main/resources') {
        include 'assets/turtlelib/icon.png'
    }

    from('../fabric/src/main/resources/assets/turtlelib/icon.png') {
        rename { 'icon.png' }
    }
}

tasks.register('copyTurtleLibNeoForgeArtifactsToDist', Copy) {
    from(layout.buildDirectory.dir('libs')) {
        include '*_MC-*_NEOFORGE_*.jar'
        exclude '*-source.jar', '*-sources.jar'
    }

    from(layout.buildDirectory.dir('libs')) {
        include '*_MC-*_NEOFORGE_*-source.jar', '*_MC-*_NEOFORGE_*-sources.jar'
        into 'sources'
    }

    into(layout.projectDirectory.dir('../dist'))
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(turtleLibCore.sourceSets.main.output)
    from(modLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }

    destinationDirectory = turtleLibDistDir
    archiveFileName = "${libNameForFile}_${project.version}_MC-${mcVersionForFile}_NEOFORGE_${neoForgeVersionForFile}.jar"
    finalizedBy(tasks.named('copyTurtleLibNeoForgeArtifactsToDist'))
    manifest {
        attributes(
            'Implementation-Title': providers.gradleProperty('turtlelib_name').getOrElse('TurtleLib'),
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'hrobasti'
        )
    }
}

tasks.named('sourcesJar') {
    from(turtleLibCore.sourceSets.main.allSource)
    from(modLicenseFile) {
        into 'META-INF'
        rename { 'LICENSE' }
    }

    destinationDirectory = turtleLibDistSourcesDir
    archiveFileName = "${libNameForFile}_${project.version}_MC-${mcVersionForFile}_NEOFORGE_${neoForgeVersionForFile}-source.jar"
    finalizedBy(tasks.named('copyTurtleLibNeoForgeArtifactsToDist'))
}
