modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
issueTrackerURL="https://github.com/hrobasti/turtle-lib-mod/issues"

[[mods]]
modId="turtlelib"
version="${file.jarVersion}"
displayName="${turtlelib_name}"
displayURL="https://kroet.net"
iconFile="assets/turtlelib/icon.png"
authors="kroet.net"
description='''
Helper library for Fabric and NeoForge mods by kroet.net. Adds no gameplay on its own; install it when a mod requires it.
Source: https://github.com/hrobasti/turtle-lib-mod
GitHub Sponsors: https://github.com/sponsors/hrobasti
Ko-Fi: https://ko-fi.com/kroet
'''

[[dependencies.turtlelib]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.turtlelib]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"
